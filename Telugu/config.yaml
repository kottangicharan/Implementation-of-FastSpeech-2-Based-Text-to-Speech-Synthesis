# FastSpeech 2 - Telugu (IndicTTS). Paths are relative to project/FastSpeech2/.

preprocess:
  dataset: "Telugu"
  path:
    corpus_path: "SPRINGLab/IndicTTS_Telugu"
    lexicon_path: "../data/Telugu/telugu-lexicon.txt"   # generated by text/telugu.py G2P
    raw_path: "../data/Telugu/raw"
    preprocessed_path: "../data/Telugu/preprocessed"
  preprocessing:
    selection:
      split: "train"
      total_hours: 6.0       # 5 h train + 1 h val; ~3 h per speaker (female + male)
      val_hours: 1.0
      min_sec: 1.0
      max_sec: 11.0          # corpus has clips up to 152 s; 11 s ~= 950 frames < max_seq_len
    text:
      text_cleaners: []
      language: "te"
    audio:
      sampling_rate: 22050   # IndicTTS is 48 kHz -> downsampled
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256
  multi_speaker: True        # neither speaker alone has 6 h
  max_seq_len: 1000
  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"

train:
  path:
    ckpt_path: "../Telugu/checkpoints"
    log_path: "../Telugu/logs"
    result_path: "../Telugu/logs/synth"
  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [25000, 32000, 37000]
    anneal_rate: 0.3
  step:
    total_step: 40000
    log_step: 100
    synth_step: 2000
    val_step: 1000
    save_step: 5000

mfa:
  conda: "$USERPROFILE/miniforge3/Scripts/conda.exe"
  env: "mfa"
  commands:
    # No usable pretrained Telugu MFA model: train one on our corpus + G2P lexicon, exporting alignments
    - [train, ../data/Telugu/raw, ../data/Telugu/telugu-lexicon.txt, ../data/Telugu/mfa_telugu_acoustic.zip, --output_directory, ../data/Telugu/preprocessed/TextGrid, --clean, -j, 4,
       --temporary_directory, ../data/Telugu/mfa_tmp]   # own workspace: default ~/Documents/MFA/<corpus dir name> = "raw" collides with English

inference:
  speaker: "female"
  results_dir: "../Results/Telugu"
  test_sentences:
    T1: "న్యూరోఫార్మకోలాజికల్ పరిశోధనలో నూతన ఔషధాల ప్రభావాన్ని విశ్లేషించారు."
    T2a: "తాడుపై అతని పట్టు చాలా బలంగా ఉంది."
    T2b: "ఆమె పట్టు చీరను ధరించి వేడుకకు వచ్చింది."
    T3: "పులి అడ విలో నిశ్శబ్దంగా నడిచింది."
    T4: "ఈ సమావేశం 2026 నవంబర్ 12వ తేదీ ఉదయం 10:45 గంటలకు ప్రారంభమవుతుంది, సమయానికి సిద్ధంగా ఉంచండి."
